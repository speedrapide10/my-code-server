name: Poll Remote Repo and Build Image

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

jobs:
  poll-and-build:
    name: Poll Tags and Build New Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Poll remote tags and prepare build list
        id: poll
        env:
          REMOTE_REPO_URL: "https://github.com/linuxserver/docker-code-server.git"
          DOCKER_HUB_IMAGE: "speedrapide10/my-code-server"
          GHCR_IMAGE: "ghcr.io/${{ github.repository }}"
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x # Enable verbose logging for easier troubleshooting

          echo "--- START: Poll remote tags ---"
          echo "Remote Repo: $REMOTE_REPO_URL"
          echo "Docker Hub Image: $DOCKER_HUB_IMAGE"
          echo "GHCR Image: $GHCR_IMAGE"
          
          # --- A. Get Remote Tags ---
          echo "Fetching remote tags..."
          
          # Use '|| true' on each piped command to prevent "Broken pipe" errors from failing the step
          # FIX: Changed sed 's_refs/tags/g' to sed 's|refs/tags/||g'
          REMOTE_TAGS=$( (git ls-remote --tags $REMOTE_REPO_URL || true) | \
                          (awk '{print $2}' || true) | \
                          (grep 'refs/tags/.*-ls' || true) | \
                          (sed 's|refs/tags/||g' || true) | \
                          (grep -E '^[0-9]+\.[0-9]+\.[0-9]+-ls[0-9]+$' || true) | \
                          (sort -V -r || true) )

          if [ -z "$REMOTE_TAGS" ]; then
            echo "::warning::No remote tags found matching pattern. Exiting successfully."
            echo "build-needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found remote tags. Full list (sorted newest-first):"
          echo "$REMOTE_TAGS"
          echo "---"

          FINAL_TAGS_TO_BUILD=""

          # --- B. Authenticate Skopeo ---
          echo "Logging into registries with skopeo..."
          skopeo login -u "$DOCKER_USER" -p "$DOCKER_PASS" docker.io
          skopeo login -u "$GHCR_USER" -p "$GHCR_PASS" ghcr.io

          # --- C. Compare Remote Tags to Registry Tags ---
          for TAG in $REMOTE_TAGS; do
            echo "---"
            echo "Checking Tag: $TAG"
            
            skopeo inspect "docker://$DOCKER_HUB_IMAGE:$TAG" > /dev/null 2>&1
            SKOPEO_EXIT_CODE=$?
            
            if [ $SKOPEO_EXIT_CODE -ne 0 ]; then
              # Tag does NOT exist
              echo "Result: Tag $TAG is NEW. Adding to build list."
              
              if [ -z "$FINAL_TAGS_TO_BUILD" ]; then
                FINAL_TAGS_TO_BUILD="$DOCKER_HUB_IMAGE:$TAG,$GHCR_IMAGE:$TAG"
              else
                FINAL_TAGS_TO_BUILD="$FINAL_TAGS_TO_BUILD,$DOCKER_HUB_IMAGE:$TAG,$GHCR_IMAGE:$TAG"
              fi
            else
              # Tag ALREADY exists
              echo "Result: Tag $TAG already exists on Docker Hub. Stopping further checks."
              break
            fi
          done
          echo "---"

          # --- D. Set Outputs for the Next Step ---
          if [ -z "$FINAL_TAGS_TO_BUILD" ]; then
            echo "::notice::No new tags to build. Nothing to do."
            echo "build-needed=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::New tags to build: $FINAL_TAGS_TO_BUILD"
            echo "build-needed=true" >> $GITHUB_OUTPUT
            echo "final-tags=$FINAL_TAGS_TO_BUILD" >> $GITHUB_OUTPUT
          fi
          echo "--- END: Poll remote tags ---"

      - name: Build and push Docker images
        if: steps.poll.outputs.build-needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.poll.outputs.final-tags }}
          labels: "org.opencontainers.image.source=${{ github.repositoryUrl }}"
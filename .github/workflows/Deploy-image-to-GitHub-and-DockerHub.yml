name: Poll Remote Repo and Build Image

on:
  # 1. Run automatically twice a day (04:00 and 16:00 UTC)
  schedule:
    - cron: "0 4,16 * * *"
  
  # 2. Allow manual triggers from the GitHub Actions tab
  workflow_dispatch:

jobs:
  poll-and-build:
    name: Poll Tags and Build New Images
    runs-on: ubuntu-latest
    
    # Permissions needed:
    # - packages: write (to push to GHCR)
    # - contents: read (to checkout the repo)
    permissions:
      packages: write
      contents: read
      
    steps:
      # --- STEP 1: CHECKOUT ---
      - name: Check out the repo
        uses: actions/checkout@v4

      # --- STEP 2: LOG IN TO REGISTRIES ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- STEP 3: INSTALL VERIFICATION TOOL ---
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      # --- STEP 4: POLL, COMPARE, AND PREPARE BUILD LIST ---
      - name: Poll remote tags and prepare build list
        id: poll # Step ID, so we can use its "outputs" later
        env:
          # --- Environment Variables ---
          REMOTE_REPO_URL: "https://github.com/linuxserver/docker-code-server.git"
          DOCKER_HUB_IMAGE: "speedrapide10/my-code-server"
          GHCR_IMAGE: "ghcr.io/${{ github.repository }}"
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Enable verbose command logging for this step
          set -x
          
          echo "--- START: Poll remote tags ---"
          
          # --- A. Get NEWEST Remote Tag ---
          echo "Fetching newest tag from $REMOTE_REPO_URL..."
          
          # Use '|| true' to prevent pipe failures
          NEWEST_REMOTE_TAG=$( (git ls-remote --tags $REMOTE_REPO_URL || true) | \
                               (awk '{print $2}' || true) | \
                               (grep 'refs/tags/.*-ls' || true) | \
                               (sed 's|refs/tags/||g' || true) | \
                               (grep -E '^[0-9]+\.[0-9]+\.[0-9]+-ls[0-9]+$' || true) | \
                               (sort -V -r || true) | \
                               (head -n 1) )

          if [ -z "$NEWEST_REMOTE_TAG" ]; then
            echo "::warning::No remote tags found matching pattern. Exiting successfully."
            echo "build-needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found newest remote tag: $NEWEST_REMOTE_TAG"

          # --- B. Authenticate Skopeo ---
          echo "Logging into registries with skopeo..."
          skopeo login -u "$DOCKER_USER" -p "$DOCKER_PASS" docker.io > /dev/null 2>&1
          skopeo login -u "$GHCR_USER" -p "$GHCR_PASS" ghcr.io > /dev/null 2>&1

          # --- C. Check if NEWEST tag already exists ---
          # We check BOTH Docker Hub and GHCR. If it is missing from EITHER, we build.
          
          MISSING_ON_DOCKERHUB=false
          if ! skopeo inspect "docker://$DOCKER_HUB_IMAGE:$NEWEST_REMOTE_TAG" > /dev/null 2>&1; then
            MISSING_ON_DOCKERHUB=true
            echo "::notice::Tag $NEWEST_REMOTE_TAG is missing on Docker Hub."
          fi

          MISSING_ON_GHCR=false
          if ! skopeo inspect "docker://$GHCR_IMAGE:$NEWEST_REMOTE_TAG" > /dev/null 2>&1; then
            MISSING_ON_GHCR=true
            echo "::notice::Tag $NEWEST_REMOTE_TAG is missing on GHCR."
          fi

          # --- Decision ---
          if [ "$MISSING_ON_DOCKERHUB" = "false" ] && [ "$MISSING_ON_GHCR" = "false" ]; then
            # Exit code 0 means tag WAS found on BOTH
            echo "::notice::Tag $NEWEST_REMOTE_TAG already exists on BOTH Docker Hub and GHCR. No build needed."
            echo "build-needed=false" >> $GITHUB_OUTPUT
          else
            # Tag is missing on at least one registry
            echo "::notice::Tag $NEWEST_REMOTE_TAG is new or missing from one registry. Proceeding with build."
            
            # We will tag the build with both the specific tag and 'latest' for BOTH registries
            # Comma-separated list, no spaces
            FINAL_TAGS_TO_BUILD="$DOCKER_HUB_IMAGE:$NEWEST_REMOTE_TAG,$DOCKER_HUB_IMAGE:latest,$GHCR_IMAGE:$NEWEST_REMOTE_TAG,$GHCR_IMAGE:latest"
            
            echo "Tags to build: $FINAL_TAGS_TO_BUILD"
            echo "build-needed=true" >> $GITHUB_OUTPUT
            echo "final-tags=$FINAL_TAGS_TO_BUILD" >> $GITHUB_OUTPUT
          fi
          echo "--- END: Poll remote tags ---"

      # --- STEP 5: BUILD AND PUSH (Conditional) ---
      # This step will only run if the 'poll' step set "build-needed=true"
      - name: Build and push Docker images
        if: steps.poll.outputs.build-needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Pushes all the new tags collected in the 'poll' step
          tags: ${{ steps.poll.outputs.final-tags }}
          labels: "org.opencontainers.image.source=${{ github.repositoryUrl }}"
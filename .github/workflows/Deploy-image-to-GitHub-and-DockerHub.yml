name: Poll Remote Repo and Build Image (ONE-TIME FORCE BUILD)

on:
  # Run this manually ONLY
  workflow_dispatch:

jobs:
  poll-and-build:
    name: Poll Tags and Build New Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      
    steps:
      # --- STEP 1: CHECKOUT ---
      - name: Check out the repo
        uses: actions/checkout@v4

      # --- STEP 2: LOG IN TO REGISTRIES ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- STEP 3: POLL FOR NEWEST TAG (NO SKOPEO) ---
      - name: Poll remote tags and prepare build list
        id: poll # Step ID, so we can use its "outputs" later
        env:
          REMOTE_REPO_URL: "https://github.com/linuxserver/docker-code-server.git"
          DOCKER_HUB_IMAGE: "speedrapide10/my-code-server"
          GHCR_IMAGE: "ghcr.io/${{ github.repository }}"
        run: |
          set -x # Enable verbose logging
          
          echo "--- START: Poll remote tags (FORCE BUILD) ---"
          
          # --- A. Get NEWEST Remote Tag ---
          echo "Fetching newest tag from $REMOTE_REPO_URL..."
          NEWEST_REMOTE_TAG=$( (git ls-remote --tags $REMOTE_REPO_URL || true) | \
                               (awk '{print $2}' || true) | \
                               (grep 'refs/tags/.*-ls' || true) | \
                               (sed 's|refs/tags/||g' || true) | \
                               (grep -E '^[0-9]+\.[0-9]+\.[0-9]+-ls[0-9]+$' || true) | \
                               (sort -V -r || true) | \
                               (head -n 1) )

          if [ -z "$NEWEST_REMOTE_TAG" ]; then
            echo "::error::No remote tags found matching pattern. Cannot proceed."
            exit 1
          fi

          echo "Found newest remote tag: $NEWEST_REMOTE_TAG"

          # --- B. FORCE BUILD ---
          echo "::warning::Forcing build for $NEWEST_REMOTE_TAG to create repository."
          
          # We will tag the build with both the specific tag and 'latest'
          FINAL_TAGS_TO_BUILD="$DOCKER_HUB_IMAGE:$NEWEST_REMOTE_TAG, $DOCKER_HUB_IMAGE:latest, $GHCR_IMAGE:$NEWEST_REMOTE_TAG, $GHCR_IMAGE:latest"
          
          echo "Tags to build: $FINAL_TAGS_TO_BUILD"
          echo "build-needed=true" >> $GITHUB_OUTPUT
          echo "final-tags=$FINAL_TAGS_TO_BUILD" >> $GITHUB_OUTPUT
          
          echo "--- END: Poll remote tags ---"

      # --- STEP 4: BUILD AND PUSH ---
      - name: Build and push Docker images
        if: steps.poll.outputs.build-needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.poll.outputs.final-tags }}
          labels: "org.opencontainers.image.source=${{ github.repositoryUrl }}"